          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurso nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
