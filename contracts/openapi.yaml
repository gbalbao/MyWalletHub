          items:
            $ref: "#/components/schemas/AssetCreateDTO"
    AssetResponseDTO:
      type: object
      description: Ativo (posicao) cadastrado. Nao traz cotacao viva; use o summary
        da carteira.
      properties:
        id:
          type: integer
          format: int64
          description: Id do ativo.
        ticker:
          type: string
          description: Ticker.
        name:
          type: string
          description: Nome vindo da Brapi.
        amount:
          type: integer
          format: int32
          description: "Quantidade em carteira, derivada do ledger."
        currentValue:
          type: number
          format: double
          description: "PROBLEMA CONHECIDO C1 (spec 004): preco UNITARIO gravado no\
            \ cadastro e nunca atualizado; nao e cotacao atual. Em AssetSummaryDTO,\
            \ currentValue e o valor TOTAL da posicao. Valor em BRL (implicito), double\
            \ sem arredondamento. "
        mediumPrice:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Preco\
            \ medio ponderado por acao, derivado do ledger."
        fairValue:
          type: number
          format: double
          description: "PROBLEMA CONHECIDO C5 (spec 004): Graham automatico, sqrt(22.5*PE*EPS),\
            \ calculado so no cadastro e na troca de ticker; nao reflete valuations\
            \ posteriores. Valor em BRL (implicito), double sem arredondamento. null\
            \ = sem PE/EPS."
        totalInvested:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Custo\
            \ total da posicao, derivado do ledger."
    WalletResponseDTO:
      type: object
      description: Carteira com seus ativos.
      properties:
        id:
          type: integer
          format: int64
          description: Id da carteira.
        name:
          type: string
          description: Nome.
        description:
          type: string
          description: Descricao livre.
        totalInvestedValue:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Soma\
            \ de totalInvested dos ativos, derivada na leitura."
        assets:
          type: array
          description: "Ativos da carteira (AssetResponseDTO.currentValue tem semantica\
            \ propria, ver C1)."
          items:
            $ref: "#/components/schemas/AssetResponseDTO"
    ValidationErrorResponse:
      type: object
      additionalProperties:
        type: string
        description: "Erro de validacao do corpo (HTTP 400): objeto cujas chaves sao\
          \ os nomes dos campos invalidos e cujos valores sao a mensagem de validacao.\
          \ Exemplo: {\"email\": \"Invalid e-mail...\", \"password\": \"Password must\
          \ contain at least 8 characters\"}."
      description: "Erro de validacao do corpo (HTTP 400): objeto cujas chaves sao\
        \ os nomes dos campos invalidos e cujos valores sao a mensagem de validacao.\
        \ Exemplo: {\"email\": \"Invalid e-mail...\", \"password\": \"Password must\
        \ contain at least 8 characters\"}."
      properties:
        empty:
          type: boolean
    BusinessRuleErrorResponse:
      type: object
      description: "Recusa de regra de negocio (HTTP 400, ou 409 nos codigos de conflito).\
        \ O `code` e o contrato estavel; o `error` e texto de tela e pode mudar. Emitidos\
        \ pelo replay do ledger (AssetPositionCalculator): registro, edicao e exclusao\
        \ de transacoes e abertura de posicao; e os conflitos de cadastro e exclusao\
        \ (409)."
      properties:
        error:
          type: string
          description: "Mensagem para exibir ao usuario, em texto livre."
        code:
          type: string
          description: "Codigo estavel da regra violada. SELL_BEFORE_PURCHASE: venda\
            \ com data anterior a primeira compra do ativo. INSUFFICIENT_POSITION:\
            \ venda maior que a posicao existente na data informada. FUTURE_TRANSACTION_DATE:\
            \ data da transacao no futuro. Os tres acima respondem 400. Os abaixo\
            \ respondem 409. EMAIL_ALREADY_EXISTS: e-mail ja cadastrado. WALLET_HAS_ASSETS:\
            \ carteira com ativos excluida sem force=true. CANNOT_DELETE_SELF: ADMIN\
            \ tentando excluir a propria conta."
          enum:
          - SELL_BEFORE_PURCHASE
          - INSUFFICIENT_POSITION
          - FUTURE_TRANSACTION_DATE
          - EMAIL_ALREADY_EXISTS
          - WALLET_HAS_ASSETS
          - CANNOT_DELETE_SELF
    ErrorResponse:
      type: object
      description: "Erro generico: IllegalArgumentException, EntityNotFoundException\
        \ (404), AccessDeniedException de ownership (403), ResponseStatusException\
        \ e qualquer RuntimeException nao tratada (400), alem do 401 de login invalido.\
        \ O texto e livre e nao e contrato estavel."
      properties:
        error:
          type: string
          description: Mensagem de erro em texto livre.
          example: "Wallet not found with id: 99"
