            \ nao decide."
        totalProfit:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Soma\
            \ dos resultados positivos."
        totalLoss:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Soma\
            \ dos prejuizos em MODULO (valor positivo ou zero)."
        netResult:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. totalProfit\
