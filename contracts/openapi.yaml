openapi: 3.1.0
info:
  title: MyWallet Consolidator API
  description: |
    API do Consolidator (MyWallet): usuarios, carteiras, ativos, transacoes, proventos, valuation e historico patrimonial.

    **Este contrato descreve a API exatamente como ela e hoje**, incluindo os problemas conhecidos abaixo. Nada foi corrigido ao documentar.

    ## Autenticacao
    - Publicas: `/auth/**` e `POST /users`. Todo o resto exige `Authorization: Bearer <jwt>` (token de `POST /auth/login`).
    - `GET`, `PUT` e `DELETE` em `/users/**` exigem papel ADMIN; sem ADMIN a resposta e 403 com `{error}`.
    - Sem token valido: 401 (corpo vazio). Recurso de outro usuario: 403 com `{error}`. Nao encontrado: 404 com `{error}`. Rota inexistente, metodo nao suportado e content-type nao suportado respondem 404, 405 e 415 com o status real.

    ## Convencoes
    - **Valores monetarios**: BRL implicito, `double` sem arredondamento.
    - **Percentuais**: de 0 a 100 (`profitLossPercentage`, `allocationPercentage`, `totalProfitLossPercentage`). Excecao: `annualizedVolatility` e fracao de 0 a 1.
    - **Datas**: `LocalDate` (`yyyy-MM-dd`) em transacoes, historico, snapshots e volatilidade; `java.util.Date` (date-time) em `computedAt`, `paymentDate` e `exDate`; `Instant` (date-time UTC) em `generatedAt`.
    - **null**: preco ou valor ausente significa "sem dado", nunca zero.
    - **Erros**: tres formatos. Validacao `{campo: mensagem}`; generico `{error}`; regra de negocio `{error, code}` com `code` em SELL_BEFORE_PURCHASE, INSUFFICIENT_POSITION, FUTURE_TRANSACTION_DATE (400) e EMAIL_ALREADY_EXISTS, WALLET_HAS_ASSETS, CANNOT_DELETE_SELF (409). Login invalido responde 401 `{error}`.

    ## Problemas conhecidos
    | ID | Problema como esta hoje | Spec que corrige |
    |---|---|---|
    | C1 | `AssetResponseDTO.currentValue` e o preco unitario gravado no cadastro e nunca atualizado; em `AssetSummaryDTO.currentValue` e o valor total da posicao | 004 |
    | C2 | O front calcula P&L localmente; o P&L oficial vem de `PortfolioTotalsDTO.totalProfitLoss` e `pricedInvested` | 004 |
    | C5 | `AssetResponseDTO.fairValue` e Graham automatico (`sqrt(22.5*PE*EPS)`), calculado so no cadastro e ao trocar o ticker | 004 |
    | C3 | `transactionDate` e `acquisitionDate` esperam `yyyy-MM-dd`; o ADC envia `...T00:00:00.000Z` e so funciona pela tolerancia do Jackson | 005 |
    | C6 | `computedAt`, `paymentDate` e `exDate` sao `java.util.Date`; o resto da API usa `LocalDate` | 005 |
    | C4 | Volatilidade em fracao (0 a 1); os demais percentuais em 0 a 100 | 006 |
    | C7 | Moeda e momento da cotacao nao sao expostos | 006 |
    | C10 | `walletId` e `String` em `AssetCreateDTO` e `Long` no resto | 006 |
    | - | Falha da Brapi em `getAssetData` vira 400 no summary, no total e em `POST /assets` | 008 |
    | - | `Asset.assetType` nunca e preenchido | 010 |
    | C8 | Rotas que mudaram sem registro (proventos sem filtro = todas as carteiras; sync por id ou ticker; `/transactions` sem filtro = tudo do usuario; `POST /wallet/{id}/assets/merge`) | Resolvido: documentadas aqui |
  version: 0.1.0
servers:
- url: http://localhost:8080
  description: Local
security:
- bearerAuth: []
tags:
- name: Transactions
  description: "Ledger de compras e vendas (BUY/SELL) e resultado realizado. A posicao\
    \ do ativo (amount, mediumPrice, totalInvested) deriva deste ledger."
- name: Users
  description: Cadastro e consulta de usuarios.
- name: Dividends
  description: Proventos recebidos (manuais ou sincronizados da Brapi).
- name: Wallets
  description: "Carteiras do usuario autenticado, resumo vivo, historico e volatilidade.\
    \ As carteiras sempre sao escopadas pelo token."
- name: Auth
  description: Login (publico).
- name: Assets
  description: "Ativos (posicoes) e valuations. Posicao (amount, mediumPrice, totalInvested)\
    \ deriva do ledger de transacoes."
paths:
  /wallet/{id}:
    get:
      tags:
      - Wallets
      summary: Buscar carteira por id
      description: Carteira de outro usuario responde 403.
      operationId: getWalletById
      parameters:
      - name: id
        in: path
        description: Id da carteira.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Carteira.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponseDTO"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
        "403":
          description: Recurso existe mas pertence a outro usuario (AccessDeniedException
            de ownership).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurso nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Wallets
      summary: Atualizar carteira
      description: Atualiza nome e descricao. Carteira de outro usuario responde 403.
      operationId: updateWallet
      parameters:
      - name: id
        in: path
        description: Id da carteira.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WalletDTO"
        required: true
      responses:
        "200":
          description: Carteira atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletResponseDTO"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
        "403":
          description: Recurso existe mas pertence a outro usuario (AccessDeniedException
            de ownership).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurso nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Wallets
      summary: Excluir carteira
      description: "Carteira sem ativos e excluida (com os snapshots). Carteira com\
        \ ativos e sem force responde 409 com code WALLET_HAS_ASSETS e a quantidade\
        \ de ativos na mensagem, sem apagar nada. Com force=true apaga, numa unica\
        \ transacao, a carteira, os ativos, as transacoes, os proventos, as valuations\
        \ e os snapshots; a cascata e irreversivel. Carteira de outro usuario responde\
        \ 403 e inexistente 404, com ou sem force."
      operationId: deleteWallet
      parameters:
      - name: id
        in: path
        description: Id da carteira.
        required: true
        schema:
          type: integer
          format: int64
      - name: force
        in: query
        description: Confirma a exclusao em cascata de uma carteira com ativos. Padrao
          false.
        required: false
        schema:
          type: boolean
          default: false
      responses:
        "204":
          description: Excluida. Sem corpo.
        "409":
          description: Carteira com ativos e sem force=true (code WALLET_HAS_ASSETS).
            Nada foi apagado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRuleErrorResponse"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
        "403":
          description: Recurso existe mas pertence a outro usuario (AccessDeniedException
            de ownership).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurso nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /users/{id}:
    get:
      tags:
      - Users
      summary: Buscar usuario por id (ADMIN)
      description: "Exige papel ADMIN (GET /users/**); sem ADMIN responde 403 com\
        \ {error}. Usuario inexistente responde 404."
      operationId: getById
      parameters:
      - name: id
        in: path
        description: Id do usuario.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Usuario.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
        "404":
          description: Usuario nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuario autenticado sem papel ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
    put:
      tags:
      - Users
      summary: Atualizar usuario (ADMIN)
      description: "Exige papel ADMIN (PUT /users/**); sem ADMIN responde 403 com\
        \ {error} e nada muda. E-mail ja usado por outro usuario responde 409 com\
        \ code EMAIL_ALREADY_EXISTS. Usuario inexistente responde 404."
      operationId: updateUser
      parameters:
      - name: id
        in: path
        description: Id do usuario.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserDTO"
        required: true
      responses:
        "200":
          description: Usuario atualizado.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserResponseDTO"
        "404":
          description: Usuario nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuario autenticado sem papel ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: E-mail ja usado por outro usuario (code EMAIL_ALREADY_EXISTS).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRuleErrorResponse"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
    delete:
      tags:
      - Users
      summary: Excluir usuario (ADMIN)
      description: "Exige papel ADMIN (DELETE /users/**); sem ADMIN responde 403 com\
        \ {error}. Apaga o usuario e, numa unica transacao, todas as carteiras dele\
        \ com ativos, transacoes, proventos, valuations e snapshots (a mesma cascata\
        \ de DELETE /wallet/{id}?force=true). O ADMIN que tenta excluir a propria\
        \ conta recebe 409 com code CANNOT_DELETE_SELF e nada e apagado. Usuario inexistente\
        \ responde 404."
      operationId: deleteUser
      parameters:
      - name: id
        in: path
        description: Id do usuario.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Excluido. Sem corpo.
        "404":
          description: Usuario nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Usuario autenticado sem papel ADMIN.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: ADMIN tentando excluir a propria conta (code CANNOT_DELETE_SELF).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BusinessRuleErrorResponse"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
  /transactions/{id}:
    get:
      tags:
      - Transactions
      summary: Buscar transacao por id
      description: Transacao de outro usuario responde 403.
      operationId: getById_1
      parameters:
      - name: id
        in: path
        description: Id da transacao.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Transacao.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponseDTO"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
        "403":
          description: Recurso existe mas pertence a outro usuario (AccessDeniedException
            de ownership).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurso nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      tags:
      - Transactions
      summary: Atualizar transacao
      description: Substitui os dados da transacao e recalcula a posicao pelo replay.
        Mesmas regras de negocio (400 com code) e mesmo formato de data do POST.
      operationId: updateTransaction
      parameters:
      - name: id
        in: path
        description: Id da transacao.
        required: true
        schema:
          type: integer
          format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransactionDTO"
        required: true
      responses:
        "200":
          description: Transacao atualizada.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TransactionResponseDTO"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
        "403":
          description: Recurso existe mas pertence a outro usuario (AccessDeniedException
            de ownership).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurso nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      tags:
      - Transactions
      summary: Excluir transacao
      description: Remove a transacao e recalcula a posicao pelo replay. Transacao
        de outro usuario responde 403.
      operationId: deleteTransaction
      parameters:
      - name: id
        in: path
        description: Id da transacao.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "204":
          description: Excluida. Sem corpo.
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
        "403":
          description: Recurso existe mas pertence a outro usuario (AccessDeniedException
            de ownership).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Recurso nao encontrado (EntityNotFoundException).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /assets/{id}:
    get:
      tags:
      - Assets
      summary: Buscar ativo por id
      description: Ativo de outro usuario responde 403.
      operationId: getById_2
      parameters:
      - name: id
        in: path
        description: Id do ativo.
        required: true
        schema:
          type: integer
          format: int64
      responses:
        "200":
          description: Ativo.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssetResponseDTO"
        "400":
          description: "Requisicao recusada. Tres formatos possiveis: validacao do\
            \ corpo {campo: mensagem} (ValidationErrorResponse), regra de negocio\
            \ {error, code} (BusinessRuleErrorResponse) ou erro generico {error} (ErrorResponse).\
            \ Qualquer RuntimeException nao tratada tambem vira 400."
          content:
            application/json:
              schema:
                oneOf:
                - $ref: "#/components/schemas/ValidationErrorResponse"
                - $ref: "#/components/schemas/BusinessRuleErrorResponse"
                - $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: "Token JWT ausente, invalido ou expirado. Corpo vazio."
        "403":
