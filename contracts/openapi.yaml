        taxableResult:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Resultado\
            \ apos compensacao (gerencial)."
        lossCarryForward:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Prejuizo\
            \ remanescente a compensar."
        sales:
