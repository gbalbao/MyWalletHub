components:
  schemas:
    AssetCreateDTO:
      type: object
      description: "Abertura de posicao: cria o ativo e, se unitPrice vier, uma compra\
        \ BUY sintetica."
      properties:
        ticker:
          type: string
          description: "Ticker na B3 (ex.: PETR4). Nome e dados de mercado vem da\
            \ Brapi."
          minLength: 1
        walletId:
          type: string
          description: "Id da carteira, como STRING numerica. PROBLEMA CONHECIDO C10\
            \ (spec 006): e Long no resto da API."
          minLength: 1
        amount:
          type: integer
          format: int32
          description: "Quantidade de acoes, inteiro maior que zero."
        unitPrice:
          type: number
          format: double
          description: "Valor em BRL (implicito), double sem arredondamento. Preco\
            \ unitario da compra de abertura, maior que zero. null = ativo criado\
