      properties:
        generatedAt:
          type: string
          format: date-time
          description: "Instante da geracao (Instant, ISO-8601 UTC)."
        walletId:
          type: integer
          format: int64
          description: Carteira filtrada. null = todas as carteiras do usuario.
        from:
          type: string
          format: date
          description: Inicio do periodo (yyyy-MM-dd). null = sem limite.
        to:
          type: string
          format: date
          description: Fim do periodo (yyyy-MM-dd). null = sem limite.
        saleCount:
          type: integer
          format: int32
          description: Numero de vendas no periodo.
        totalProceeds:
          type: number
          format: double
